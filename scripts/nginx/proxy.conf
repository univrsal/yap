# How nginx passes requests on to yap's relay: the web client, the browsers'
# WebSockets and the bot API.

proxy_pass http://yap_relay;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# The relay only accepts its own site's web client, which it tells by these.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
# The API's rate limits and /login go by these (api.behind_proxy).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# A WebSocket stays open for as long as the client is connected, and the
# server limits the size of uploads itself.
proxy_read_timeout 1d;
proxy_send_timeout 1d;
proxy_buffering off;
proxy_request_buffering off;
client_max_body_size 0;
