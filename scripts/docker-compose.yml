# The yap server, and optionally nginx in front of its web client with a
# Let's Encrypt certificate (the proxy profile). The settings below come from
# the environment or a .env file next to this one (see .env.example):
#
#   docker compose up -d                    the server alone
#   docker compose --profile proxy up -d    with nginx and certbot
#
# The server's own settings are in config.json in the data volume, which is
# created on the first start (see src/server/config.odin).

services:
  yap:
    image: ${YAP_IMAGE:-ghcr.io/univrsal/yap:latest}
    restart: unless-stopped
    # The server doesn't handle signals, which PID 1 then ignores, so this
    # lets `docker compose stop` stop it without waiting for the timeout.
    init: true
    # The ports are the same inside and outside the container, because clients
    # are told the video port. The server takes them from the environment.
    ports:
      - '${YAP_PORT:-7777}:${YAP_PORT:-7777}/udp'
      - '${YAP_VIDEO_PORT:-7778}:${YAP_VIDEO_PORT:-7778}/udp'
      # YAP_RELAY_HOST_IP=127.0.0.1 keeps the plain-HTTP relay off the
      # network, e.g. when nginx is the way in.
      - '${YAP_RELAY_HOST_IP:+${YAP_RELAY_HOST_IP}:}${YAP_RELAY_PORT:-8080}:${YAP_RELAY_PORT:-8080}/tcp'
    volumes:
      - yap-extended-data:/data
    environment:
      YAP_PORT: ${YAP_PORT:-7777}
      YAP_VIDEO_PORT: ${YAP_VIDEO_PORT:-7778}
      # Applied on every start if not empty.
      YAP_VIDEO_ENABLED: ${YAP_VIDEO_ENABLED:-}
      YAP_RELAY_PORT: ${YAP_RELAY_PORT:-8080}
      # Applied on every start if not empty.
      YAP_RELAY_ALLOW_SITES: ${YAP_RELAY_ALLOW_SITES:-}
      # Only used when config.json is created.
      YAP_RELAY_ENABLED: ${YAP_RELAY_ENABLED:-false}
      YAP_INITIAL_ADMIN_PASSWORD: ${YAP_INITIAL_ADMIN_PASSWORD:-}

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [yap]
    ports:
      - '${YAP_HTTP_PORT:-80}:80/tcp'
      - '${YAP_HTTPS_PORT:-443}:443/tcp'
    volumes:
      - ./nginx:/etc/nginx/yap:ro
      - ./nginx/yap.sh:/docker-entrypoint.d/40-yap.sh:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    environment:
      YAP_DOMAIN: ${YAP_DOMAIN:-}
      YAP_RELAY_PORT: ${YAP_RELAY_PORT:-8080}
      YAP_HTTPS_PORT: ${YAP_HTTPS_PORT:-443}

  certbot:
    image: docker.io/certbot/certbot:v5.8.0
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [nginx]
    entrypoint: ['/bin/sh', '/yap/certbot.sh']
    volumes:
      - ./nginx/certbot.sh:/yap/certbot.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      YAP_DOMAIN: ${YAP_DOMAIN:-}
      YAP_CERT_EMAIL: ${YAP_CERT_EMAIL:-}
      YAP_CERT_STAGING: ${YAP_CERT_STAGING:-}

volumes:
  # Named after the branch the image used to be built from; kept so that
  # existing servers keep their data.
  yap-extended-data:
  certbot-certs:
  certbot-webroot:
