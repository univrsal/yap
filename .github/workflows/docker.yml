name: Docker

on:
  pull_request:
  push:
    branches: [master, extended]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.ref == 'refs/heads/extended' && format('ghcr.io/{0}/yap-extended', github.repository_owner) || format('ghcr.io/{0}/yap', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/extended' }}

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          load: true
          push: false
          tags: yap:ci
          platforms: linux/amd64
          build-args: |
            YAP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            YAP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          YAP_INITIAL_ADMIN_PASSWORD: ci-initial-admin-password
        run: |
          docker volume create yap-smoke-data
          docker run --detach --name yap-smoke \
            --publish 18080:18080/tcp \
            --mount type=volume,src=yap-smoke-data,dst=/data \
            --env YAP_RELAY_ENABLED=true \
            --env YAP_RELAY_PORT=18080 \
            --env YAP_INITIAL_ADMIN_PASSWORD \
            yap:ci
          trap 'docker rm --force yap-smoke; docker volume rm yap-smoke-data' EXIT
          for _ in $(seq 1 10); do
            docker exec yap-smoke test -f /data/config.json && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' yap-smoke)" = true
          docker exec yap-smoke test -f /data/config.json
          docker exec yap-smoke grep -F '"enabled": true' /data/config.json
          docker exec yap-smoke grep -F '"port": 18080' /data/config.json
          docker logs yap-smoke 2>&1 | grep -F 'listening on udp :7777'
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:18080/
          ! docker logs yap-smoke 2>&1 | grep -F "$YAP_INITIAL_ADMIN_PASSWORD"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            YAP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            YAP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
