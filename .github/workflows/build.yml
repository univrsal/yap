name: Build

# Builds the web client and the desktop client and server for Linux,
# Windows and macOS, and packs each desktop platform into a zip holding
# the client, the server and the web build (in web/). macOS also gets a
# .dmg holding just the client, and Windows an installer for the client
# and the screen sharing add-on (scripts/package/yap.iss). release.yml calls
# this for a tag and attaches the zips to a draft release.
on:
  push:
    branches: [master]
    # Everything that goes into a build: sources and their assets, the web
    # shell, the build and packaging scripts and dependency pins, and CI.
    paths:
      - 'src/**'
      - 'web/**'
      - 'deps/**'
      - 'scripts/**'
      - 'build.sh'
      - 'build.bat'
      - '.github/workflows/**'
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Name the artifacts without the commit hash
        type: boolean
        default: false

env:
  # The Odin release to build with (https://github.com/odin-lang/Odin/releases).
  # Keep in line with ODIN_RELEASE in docker/Dockerfile.
  ODIN_RELEASE: dev-2026-09
  # The Emscripten release for the web client. Keep in line with the
  # emsdk image in docker/Dockerfile.
  EMSDK_VERSION: 6.0.13
  # The version the client's About dialog shows (scripts/build/version-defines.sh):
  # the tag for a release, and "dev" otherwise.
  YAP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # The desktop client and server are built for size for a release, and
  # for speed otherwise. (The web client always builds with -o:speed, see
  # web/build.sh.)
  OPT: ${{ inputs.release && '-o:size' || '-o:speed' }}

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Cache libopus for wasm
        uses: actions/cache@v6
        with:
          path: web/deps
          key: opus-wasm-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build/opus.version') }}
      - run: sh web/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: |
            web/out/index.html
            web/out/index.js
            web/out/index.wasm
            web/out/favicon.ico
            web/out/manifest.webmanifest
            web/out/sw.js
            web/out/icon-192.png
            web/out/icon-512.png
            web/out/apple-touch-icon.png
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux-x64
          - name: Windows
            os: windows-latest
            platform: windows-x64
          - name: macOS
            os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        # dbus headers for the tray icon, PipeWire's for application
        # audio, GLFW to link against; XCB's, GIO's and libva's for
        # screen sharing's capture (src/video), which build.sh links into
        # the client on Linux. Its FFmpeg headers come from the cached
        # prebuilt FFmpeg below.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libdbus-1-dev libx11-dev libpipewire-0.3-dev libglfw3-dev pkg-config \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-composite0-dev libxcb-xfixes0-dev \
            libglib2.0-dev libva-dev
      - name: macOS tools for FFmpeg
        if: runner.os == 'macOS'
        # scripts/build/build-ffmpeg-macos.sh builds dav1d with meson.
        run: brew install pkgconf meson ninja
      - name: Cache FFmpeg
        # The prebuilt archives on Linux and Windows; on macOS, the build
        # from source (scripts/build/build-ffmpeg-macos.sh), which takes minutes.
        uses: actions/cache@v6
        with:
          path: |
            .cache/ffmpeg-*.zip
            .cache/ffmpeg-*.tar.xz
            .cache/ffmpeg-*-dav1d-*-darwin-*
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/ffmpeg.version', 'scripts/build/build-ffmpeg-macos.sh') }}
      - name: Cache libopus for macOS
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: src/client/audio/opus/libopus_macos.a
          key: opus-macos-${{ runner.arch }}-${{ hashFiles('scripts/build/opus.version', 'build.sh') }}

      - name: Cache libopus for Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: src/client/audio/opus/opus.lib
          key: opus-windows-${{ hashFiles('scripts/build/opus.version', 'build.bat') }}

      - name: Cache libwebp
        # scripts/build/build-webp.sh and build.bat only build it when it isn't
        # there; the small yap_webp.c is compiled against the source's
        # headers, which they fetch.
        uses: actions/cache@v6
        with:
          path: |
            src/common/webp/libwebp.a
            src/common/webp/libwebpdemux.a
            src/common/webp/libsharpyuv.a
            src/common/webp/libwebp.lib
            src/common/webp/libwebpdemux.lib
            src/common/webp/libsharpyuv.lib
          key: webp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/webp.version', 'scripts/build/build-webp.sh', 'build.bat') }}

      - name: Cache the SQLite source
        # build.sh and build.bat fetch it (scripts/build/fetch-sqlite.sh) when
        # it isn't there, and check it either way.
        uses: actions/cache@v6
        with:
          path: .cache/sqlite-autoconf-*.tar.gz
          key: sqlite-${{ hashFiles('scripts/build/sqlite.version') }}
          enableCrossOsArchive: true

      - name: Odin's stb libraries
        if: runner.os != 'Windows'
        # Odin's release doesn't always ship these built for Linux/macOS.
        # Newer releases build them with build_stb.sh, older ones (up to
        # at least dev-2026-07) with a Makefile.
        run: |
          stb="$(odin root)/vendor/stb/src"
          [ -f "$(odin root)/vendor/stb/lib/stb_image.a" ] && exit 0
          if [ -f "$stb/build_stb.sh" ]; then sh "$stb/build_stb.sh"; else make -C "$stb"; fi

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh build.sh $OPT
      - name: Strip symbols (Linux, macOS)
        # A release doesn't need the symbol table; Windows builds have no
        # debug info in the .exe to begin with.
        if: runner.os != 'Windows' && inputs.release
        run: strip bin/yap bin/yap-server

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat %OPT%

      # The add-on is optional (the client runs without it), so its steps
      # failing doesn't stop the client's artifacts; the job shows them
      # as failed steps all the same.
      - name: Build the screen sharing add-on (Linux, macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: sh scripts/build/build-video.sh
      - name: Build the screen sharing add-on (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        run: scripts\build\build-video.bat

      - name: Test
        shell: bash
        run: |
          . scripts/build/collections.sh
          odin test src/common/proto $collections -vet -strict-style
          odin test src/common/webp $collections -vet -strict-style
          odin test src/common/gif $collections -vet -strict-style
          odin test src/client/hotkeys $collections -vet -strict-style
          odin test src/client/richtext $collections -vet -strict-style
          odin test src/server/mail $collections -vet -strict-style
          odin test src/server $collections -vet -strict-style

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web-build
      - name: Pack
        shell: bash
        run: sh scripts/package/package.sh ${{ matrix.platform }} web-build
      - name: Artifact name
        id: name
        shell: bash
        # Builds carry the commit they came from; a release is named by its tag.
        run: |
          if [ "${{ inputs.release }}" = true ]; then
            echo "name=yap-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=yap-${{ matrix.platform }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack the screen sharing add-on
        id: pack_video
        continue-on-error: true
        shell: bash
        run: sh scripts/package/package-video.sh ${{ matrix.platform }}
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/package/package-macos.sh arm64
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: dmg-${{ matrix.platform }}
          path: dist/Yap-arm64.dmg
          if-no-files-found: error
      # The installer has the add-on as a part to leave out, so it needs
      # the add-on built.
      - name: Installer (Windows)
        if: runner.os == 'Windows' && steps.pack_video.outcome == 'success'
        shell: bash
        # Inno Setup, if the runner image doesn't come with it.
        run: |
          [ -d "$PROGRAMFILES (x86)/Inno Setup 6" ] || [ -d "$PROGRAMFILES/Inno Setup 7" ] ||
            choco install innosetup -y --no-progress
          sh scripts/package/package-windows.sh x64
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && steps.pack_video.outcome == 'success'
        with:
          name: setup-${{ matrix.platform }}
          path: dist/Yap-Setup-x64.exe
          if-no-files-found: error

      # GitHub zips an artifact itself, so the folder is uploaded rather
      # than a zip (which would end up zipped twice).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/yap-${{ matrix.platform }}/
          if-no-files-found: error
      # A part of the add-on's download, which the video job below
      # gathers into one artifact with a folder per platform.
      - name: Add-on part name
        id: part
        if: steps.pack_video.outcome == 'success'
        shell: bash
        run: |
          platform=${{ matrix.platform }}
          echo "name=video-part-${platform%%-*}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        # Only if there's something: a failed build already says why.
        if: steps.pack_video.outcome == 'success'
        with:
          name: ${{ steps.part.outputs.name }}
          path: dist/yap-video-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 1

  # The screen sharing add-on as a single download, yap-video/ holding
  # linux/, macos/ and windows/, each unpacked next to yap (D12 in
  # misc/hq-share/README.md). Whatever platforms built go in, even if
  # another one failed.
  video:
    name: Screen sharing add-on
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: video-part-*
          path: parts
      - name: Gather
        id: gather
        run: |
          mkdir -p yap-video
          for d in parts/video-part-*/; do
            [ -d "$d" ] || continue
            p=${d%/}
            mv "$p" "yap-video/${p#parts/video-part-}"
          done
          if [ -z "$(ls yap-video)" ]; then
            echo "no platform built the add-on" >&2
            exit 1
          fi
          if [ "${{ inputs.release }}" = true ]; then
            echo "name=yap-video" >> "$GITHUB_OUTPUT"
          else
            echo "name=yap-video-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.gather.outputs.name }}
          path: yap-video/
          if-no-files-found: error
      - name: Delete the parts
        # A pull request from a fork can't delete artifacts; the parts
        # expire after a day anyway.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("video-part-")) | .id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
