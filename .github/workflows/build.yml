name: Build

# Builds the web client and the desktop client and server for Linux,
# Windows and macOS, and packs each desktop platform into a zip holding
# the client, the server and the web build (in web/). macOS also gets a
# .dmg holding just the client. release.yml calls
# this for a tag and attaches the zips to a draft release.
on:
  push:
    branches: [master, extended]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.js'
      - '**/*.odin'
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Name the artifacts without the commit hash
        type: boolean
        default: false

env:
  # The Odin release to build with (https://github.com/odin-lang/Odin/releases).
  ODIN_RELEASE: dev-2026-07
  # The version the client's About dialog shows (scripts/version-defines.sh):
  # the tag for a release, and "dev" otherwise.
  YAP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # The desktop client and server are built for size for a release, and
  # for speed otherwise. (The web client always builds with -o:speed, see
  # web/build.sh.)
  OPT: ${{ inputs.release && '-o:size' || '-o:speed' }}

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v16
      - name: Cache libopus for wasm
        uses: actions/cache@v6
        with:
          path: web/deps
          key: opus-wasm-${{ hashFiles('scripts/opus.version') }}
      - run: ./web/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: |
            web/out/index.html
            web/out/index.js
            web/out/index.wasm
            web/out/favicon.ico
            web/out/manifest.webmanifest
            web/out/icon-192.png
            web/out/icon-512.png
            web/out/apple-touch-icon.png
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux-x64
          - name: Windows
            os: windows-latest
            platform: windows-x64
          - name: macOS
            os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        # dbus headers for the tray icon, PipeWire's for application
        # audio, GLFW to link against.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libx11-dev libpipewire-0.3-dev libglfw3-dev pkg-config
      - name: Cache libopus for macOS
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: src/client/audio/opus/libopus_macos.a
          key: opus-macos-${{ runner.arch }}-${{ hashFiles('scripts/opus.version', 'build.sh') }}

      - name: Cache libopus for Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: src/client/audio/opus/opus.lib
          key: opus-windows-${{ hashFiles('scripts/opus.version', 'build.bat') }}

      - name: Cache the SQLite source
        # build.sh and build.bat fetch it (scripts/fetch-sqlite.sh) when
        # it isn't there, and check it either way.
        uses: actions/cache@v6
        with:
          path: .cache/sqlite-autoconf-*.tar.gz
          key: sqlite-${{ hashFiles('scripts/sqlite.version') }}
          enableCrossOsArchive: true

      - name: Odin's stb libraries
        if: runner.os != 'Windows'
        # Odin's release doesn't always ship these built for Linux/macOS.
        run: |
          stb="$(odin root)/vendor/stb/src"
          [ -f "$(odin root)/vendor/stb/lib/stb_image.a" ] || make -C "$stb"

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./build.sh $OPT
      - name: Strip symbols (Linux, macOS)
        # A release doesn't need the symbol table; Windows builds have no
        # debug info in the .exe to begin with.
        if: runner.os != 'Windows' && inputs.release
        run: strip bin/yap bin/yap-server

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat %OPT%

      - name: Test
        shell: bash
        run: |
          collections="-collection:common=src/common -collection:client=src/client"
          odin test src/common/proto $collections -vet -strict-style
          odin test src/client/hotkeys $collections -vet -strict-style
          odin test src/server $collections -vet -strict-style

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web-build
      - name: Pack
        shell: bash
        run: scripts/package.sh ${{ matrix.platform }} web-build
      - name: Artifact name
        id: name
        shell: bash
        # Builds carry the commit they came from; a release is named by its tag.
        run: |
          if [ "${{ inputs.release }}" = true ]; then
            echo "name=yap-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=yap-${{ matrix.platform }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh arm64
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: dmg-${{ matrix.platform }}
          path: dist/Yap-arm64.dmg
          if-no-files-found: error

      # GitHub zips an artifact itself, so the folder is uploaded rather
      # than a zip (which would end up zipped twice).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/yap-${{ matrix.platform }}/
          if-no-files-found: error
