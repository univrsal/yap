name: Release

# Pushing a tag like v0.1.0 builds everything (build.yml) and puts the
# three zips in a draft release, to be edited and published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Each artifact comes down as a folder named yap-<platform>.
      - uses: actions/download-artifact@v8
        with:
          pattern: yap-*
          path: dist
      - name: Zip and create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifacts don't keep the executable bit.
          find dist -type f \( -name yap -o -name yap-server \) -exec chmod +x {} +
          (cd dist && for d in yap-*; do zip -qr "$d.zip" "$d"; done)
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "$GITHUB_REF_NAME"
